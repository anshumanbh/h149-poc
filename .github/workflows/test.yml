name: claude-code-action simulation (H-149)

# The real action never runs on `pull_request`. It runs on `issue_comment` /
# `workflow_dispatch` / `pull_request_review_comment` from the BASE branch and then
# fetches the PR head itself (branch.ts:189-206). `pull_request_target` is the
# closest single-file equivalent: workflow definition + permissions come from base,
# the PR head is fetched explicitly below.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Mirrors anthropics/claude-code-action/.github/workflows/claude.yml:20-25
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------------------------------
      # 0. Base checkout — this is what the action's own workflow does first.
      # ---------------------------------------------------------------------
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Snapshot base .claude/ (what restoreConfigFromBase() will restore)
        run: |
          mkdir -p /tmp/base-config
          cp -a .claude /tmp/base-config/.claude
          echo "::group::base .claude/settings.json"
          cat .claude/settings.json
          echo "::endgroup::"

      # ---------------------------------------------------------------------
      # 1. src/github/operations/branch.ts:189-206
      #    git fetch origin pull/<n>/head:<branch> && git checkout <branch> --
      # ---------------------------------------------------------------------
      - name: "branch.ts:189-206 — fetch and check out the PR head"
        run: |
          git fetch origin "pull/${{ github.event.pull_request.number }}/head:pr-head"
          git checkout pr-head --
          echo "::group::PR head tree (node_modules)"
          ls -la node_modules/.bin/ 2>/dev/null || echo "(no node_modules/.bin)"
          echo "::endgroup::"

      # ---------------------------------------------------------------------
      # 2. src/github/operations/restore-config.ts:105 restoreConfigFromBase()
      #    Restores ONLY SENSITIVE_PATHS (restore-config.ts:20-29).
      #    node_modules is NOT in that list — docs/security.md:58 says it
      #    "stays at the PR head".
      # ---------------------------------------------------------------------
      - name: "restore-config.ts:105 — restoreConfigFromBase()"
        run: |
          # SENSITIVE_PATHS from src/github/operations/restore-config.ts:20-29
          SENSITIVE_PATHS=(".claude" ".mcp.json" ".claude.json" ".gitmodules" ".ripgreprc" "CLAUDE.md" "CLAUDE.local.md" ".husky")
          mkdir -p .claude-pr
          for p in "${SENSITIVE_PATHS[@]}"; do
            if [ -e "$p" ]; then
              cp -a "$p" ".claude-pr/" 2>/dev/null || true
              rm -rf "$p"
            fi
            if [ -e "/tmp/base-config/$p" ]; then
              cp -a "/tmp/base-config/$p" "$p"
              echo "restored from base: $p"
            fi
          done
          echo "--- node_modules is NOT restored; it is still the PR head's ---"
          ls -la node_modules/.bin/ 2>/dev/null || echo "(no node_modules/.bin)"

      - name: Show that the hook about to run is the TRUSTED base-branch one
        run: |
          echo "::group::.claude/settings.json after restoreConfigFromBase()"
          cat .claude/settings.json
          echo "::endgroup::"
          git diff --no-index /tmp/base-config/.claude/settings.json .claude/settings.json \
            && echo "IDENTICAL to base branch — the hook is maintainer-reviewed."

      # action.yml:194 pins bun via oven-sh/setup-bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Show node resolution BEFORE the hook (system node is on PATH)
        run: |
          echo "which node -> $(which node)"
          echo "node --version -> $(node --version)"

      # ---------------------------------------------------------------------
      # 3. base-action runs the PostToolUse hook after Claude's first Edit/Write.
      #    Command is read verbatim from the base-restored .claude/settings.json.
      #    GITHUB_TOKEN is in the environment per src/entrypoints/run.ts:185-187.
      # ---------------------------------------------------------------------
      - name: "PostToolUse(Edit|Write|MultiEdit) — run the base-branch hook"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          H149_FAKE_SECRET: "this-value-stands-in-for-a-real-credential"
        run: |
          HOOK=$(python3 -c "import json;print(json.load(open('.claude/settings.json'))['hooks']['PostToolUse'][0]['hooks'][0]['command'])")
          echo "hook command (from base branch): $HOOK"
          set +e
          eval "$HOOK"
          echo "hook exit status: $?"
          set -e

      - name: Did the shim execute?
        if: always()
        run: |
          if [ -f /tmp/h149-pwned ]; then
            echo "::group::/tmp/h149-pwned"
            cat /tmp/h149-pwned
            echo "::endgroup::"
            echo "RESULT: H149-HIJACKED — PR-supplied interpreter executed inside the privileged job."
            exit 1
          else
            echo "RESULT: no marker — shim did not execute."
          fi

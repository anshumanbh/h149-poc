name: Claude Code (H-149 retest of @v1)

# Authorized 2026-11-18 retest of HackerOne #3922068 / H-149.
# Pins the official action at the floating v1 tag (currently 1.0.282 / 5a85689).
# A maintainer @claude mention on a no-write fork PR is the path the fix
# (restoreToolConfigFromBase) is supposed to protect. Defaults left in place:
# allow_fork_prs=true, restrict_untrusted_prs=true, no allowed_non_write_users.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code @v1
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # If ANTHROPIC_API_KEY is unset, a non-functional placeholder is
          # passed so validation does not fail *before* restoreToolConfigFromBase
          # runs. Claude itself will then fail to authenticate; the inspect
          # step still records whether the PR shim was removed.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY || 'h149-retest-placeholder-not-a-key' }}

      - name: Inspect workspace and hijack marker
        if: always()
        run: |
          set -euo pipefail
          echo "::group::workspace node_modules/.bin after action"
          ls -la node_modules/.bin/ 2>/dev/null || echo "(no node_modules/.bin)"
          echo "::endgroup::"
          if [ -e node_modules/.bin/node ]; then
            echo "SHIM_ON_DISK=yes"
            # Do not cat the shim; just show type and size
            ls -la node_modules/.bin/node
            file node_modules/.bin/node || true
          else
            echo "SHIM_ON_DISK=no — node_modules/.bin/node absent (restore likely removed it, or it was never checked out)"
          fi
          if [ -f /tmp/h149-retest-20261118-pwned ]; then
            echo "::group::HIJACK MARKER"
            cat /tmp/h149-retest-20261118-pwned
            echo "::endgroup::"
            echo "RESULT: STILL VULNERABLE — marker H149-RETEST-HIJACKED-20261118 appeared."
            exit 1
          else
            echo "RESULT: no hijack marker in /tmp/h149-retest-20261118-pwned"
            echo "NOTE: if Claude never performed an Edit/Write, the hook may not have run; see the action log for restoreToolConfigFromBase / tool-config warnings."
          fi
